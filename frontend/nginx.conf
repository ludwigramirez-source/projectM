# Log sin query string: SignalR envía el token JWT en ?access_token= y no debe quedar en los logs.
log_format sin_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log sin_query;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://api:8080;
    }

    # PWA: el service worker, el manifest e index.html nunca se cachean (las actualizaciones llegan enseguida).
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /theme-init.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Cabeceras de seguridad comunes. Se incluye en el bloque server y en CADA location que use add_header,
# porque en nginx un add_header dentro de un location anula los heredados del server.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# CSP: sin scripts inline (el tema se aplica con /theme-init.js). style-src admite inline por los estilos
# dinámicos de React (posiciones de arrastre, anchos de barras). La API y SignalR van por el mismo origen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

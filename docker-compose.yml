name: projectm

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}
      MSSQL_PID: Developer
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: src/ProjectM.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Server=db;Database=ProjectM;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=False"
      Jwt__Key: ${JWT_KEY:?Define JWT_KEY en .env}
      Cors__AllowedOrigins: ${ALLOWED_ORIGINS:-http://localhost:8080}
      Database__MigrateOnStartup: "true"
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:?Define SEED_ADMIN_EMAIL en .env}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?Define SEED_ADMIN_PASSWORD en .env}
      Seed__Demo: ${SEED_DEMO:-false}
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:-}
      Storage__AttachmentsPath: /data/attachments
      App__TimeZone: ${APP_TIMEZONE:-UTC}
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5010:8080"

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

  tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: tests.Dockerfile
    environment:
      TEST_SQL_CONNECTION: "Server=db;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sqldata:
  attachments:

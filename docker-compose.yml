name: projectm

services:
  # PostgreSQL local (en producción se usa Supabase; ver docs/DEPLOY.md).
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: projectm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d projectm"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: src/ProjectM.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=projectm;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?Define JWT_KEY en .env}
      Cors__AllowedOrigins: ${ALLOWED_ORIGINS:-http://localhost:8080}
      Database__MigrateOnStartup: "true"
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:?Define SEED_ADMIN_EMAIL en .env}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?Define SEED_ADMIN_PASSWORD en .env}
      Seed__Demo: ${SEED_DEMO:-false}
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:-}
      Storage__AttachmentsPath: /data/attachments
      App__TimeZone: ${APP_TIMEZONE:-UTC}
      Auth__SecureCookies: ${AUTH_SECURE_COOKIES:-true}
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5010:8080"

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

  tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: tests.Dockerfile
    environment:
      TEST_SQL_CONNECTION: "Host=db;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  attachments:
